# ============================================================
# Vector K8s DaemonSet · chart layer
# Helm installs the workload (DaemonSet/SA/Service); the Vector config itself
# lives in ConfigMaps (vector-cm.yaml) - never inside this values file.
# ============================================================
#
# Usage:
#   1) kubectl apply -f vector-cm.yaml -n vector        # two CMs at once (no params inside)
#   2) kubectl -n vector create secret generic vector-oss-secrets \
#        --from-file=oss-secrets.json=<path outside git>
#   3) helm upgrade --install vector vector/vector --version 0.51.0 \
#        -n vector --create-namespace \
#        -f values.yaml -f values.cluster-a.yaml
#
# Version lock (do not float - see CM_BEST_PRACTICES.md):
#   chart 0.51.0 + image 0.58.0-alpine (mirror prefix; nodes cannot reach docker.io)

role: Agent

# image lock: mirror prefix (nodes cannot reach docker.io directly -实测 i/o timeout)
image:
  repository: docker.1ms.run/timberio/vector
  tag: 0.58.0-alpine
  pullPolicy: IfNotPresent

# checkpoint persistence on node disk: pod restart resumes from checkpoint,
# no re-read of old logs
persistence:
  hostPath:
    enabled: true
    path: /var/lib/vector

# ------------------------------------------------------------------
# OSS credentials: DIRECTORY mount into a dedicated path.
# Never subPath a single file into the chart config mountpoint - containerd
# reports "not a directory" (see CM_BEST_PRACTICES.md pit #4).
# ------------------------------------------------------------------
extraVolumes:
  - name: oss-secrets
    secret:
      secretName: vector-oss-secrets

extraVolumeMounts:
  - name: oss-secrets
    mountPath: /etc/oss-secrets
    readOnly: true

resources:
  requests: { cpu: 200m, memory: 256Mi }
  limits: { memory: 1Gi }

# demo cluster has no taints; a production DaemonSet must tolerate all NoSchedule
# taints - otherwise tainted nodes silently get NO agent (pit #10)
tolerations: []

# Agent needs no Service; in existingConfigMaps mode the chart renders an
# empty-port Service unless disabled (pit #13)
service:
  enabled: false

# ------------------------------------------------------------------
# Vector config is externalized: the chart only mounts the ConfigMaps.
# --config-dir /etc/vector/ loads files in lexicographic order:
#   10-common.yaml (source/transform/route/dead_letter)
#   -> 20-oss.yaml (sinks; bucket/region/endpoint are ${VAR} placeholders,
#      expanded by Vector at load time from Pod env injected via the overlay)
# CM content: vector-cm.yaml (apply it BEFORE this release - CM must exist first)
# ------------------------------------------------------------------
dataDir: /vector-data-dir
existingConfigMaps:
  - vector-common
  - vector-oss
