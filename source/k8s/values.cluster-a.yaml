# ============================================================
# Cluster overlay (pairs with values.yaml): per-cluster params via env
# Vector expands ${PROD_BUCKET}/${PROD_REGION}/${OSS_ENDPOINT} at config load time.
# ============================================================
#
# Copy to values.cluster-b.yaml and change the three S3 values + cluster name.
# env list order is irrelevant; every entry must be present (missing variable =
# Vector fails at startup, fail fast).

env:
  - name: VECTOR_CLUSTER_NAME
    value: "cluster-a"
  - name: PROD_BUCKET
    value: "vector-demo"
  - name: PROD_REGION
    value: "cn-shenzhen"
  - name: OSS_ENDPOINT
    value: "https://oss-cn-shenzhen-internal.aliyuncs.com"   # same-region internal (free traffic)
  # Vector >=0.57 disables config env interpolation by default (official change):
  # the ${VAR} placeholders in vector-cm.yaml depend on this switch. Security note:
  # env is readable by anyone who can read /proc/<pid>/environ - keep only
  # non-sensitive scalars here (bucket/region/endpoint); credentials live in the
  # mounted Secret, never in env.
  - name: VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION
    value: "true"
