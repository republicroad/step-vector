# ============================================================
# Vector 测试配置：消费 SLS (Kafka 协议) → console 打印（连真实 SLS 验证，无需 OSS 密钥）
# ============================================================
#
# 配置来源（官方，与生产 vector-sls.yaml 一致）：
# - 消费 SDK 总览/限制：https://sls.aliyun.com/doc/en/oscompatibledemo/overview.html
# - Confluent-Kafka-Go 消费示例（Vector/librdkafka 同源写法）：
#   https://sls.aliyun.com/doc/en/oscompatibledemo/confluent_go_kafka_consume.html
# - 消息体字段场景（中文）：https://sls.aliyun.com/doc/oscompatibledemo/kafka_overview.html
#
# 用法（先配置 secrets/sls-secrets.json，并设置环境变量）：
#   vector --config vector-sls-test.yaml
#
# 验证点：
#   - SLS SASL_SSL 连接成功（username=Project, password=AK#SK）
#   - 能消费指定 Logstore（Topic=Logstore 名，不支持通配符）
#   - 解析 JSON 消息体（多字段日志）；单字段 content 日志按原样保留
#   - 事件时间解析正确：事件 timestamp 优先（裸格式 2026-09-07 17:09:55,994
#     按北京时间解释），无事件时间时回退摄入时间
#   - ts 字段为 RFC3339 格式（Vector 规范化生成，UTC）
#   - partition 生成 Hive 分区字段（北京时间）
#   - Kafka 元数据字段 (.topic/.partition/.offset) 正确附加
#     （.topic = Logstore 名，.partition = Shard，.offset = Cursor 位置）

data_dir: /vector-data-dir

# ------------------------------------------------------------------
# 密钥管理：从本地 JSON 文件读取
# ------------------------------------------------------------------
secret:
  sls_credentials:
    type: file
    # 需要 keys: project / access_key_id / access_key_secret / sasl_password(AK#SK)
    path: /etc/vector/sls-secrets.json

# ------------------------------------------------------------------
# 数据源：SLS Kafka 兼容消费（与生产 vector-sls.yaml source 完全一致）
# ------------------------------------------------------------------
sources:
  sls_logs:
    type: kafka
    # SLS_ENDPOINT 组装规则：{Project名称}.{region 的 SLS Endpoint}:{端口}
    #   公网： my-project.cn-hangzhou.log.aliyuncs.com:10012
    #   内网： my-project.cn-hangzhou-intranet.log.aliyuncs.com:10011
    # 测试从本机/开发环境运行，使用公网 endpoint（内网需同地域 VPC）：
    #   公网： my-project.cn-hangzhou.log.aliyuncs.com:10012
    #   内网： my-project.cn-hangzhou-intranet.log.aliyuncs.com:10011
    bootstrap_servers: "my-project.cn-hangzhou.log.aliyuncs.com:10012"

    # Topic = Logstore 名称（Project 已在 endpoint 前缀中，无需再拼）
    topics:
      - app-logs

    group_id: vector-sls-test            # 测试用独立消费组，不影响生产位移
    auto_offset_reset: earliest
    session_timeout_ms: 120000

    # SLS 仅支持 SASL_SSL + PLAIN
    sasl:
      enabled: true
      mechanism: PLAIN
      username: SECRET[sls_credentials.project]
      password: SECRET[sls_credentials.sasl_password]

    tls:
      enabled: true

# ------------------------------------------------------------------
# 转换：解析消息体 + 事件时间解析 + ts 规范化（与生产配置完全一致）
# ------------------------------------------------------------------
transforms:
  parse_sls:
    type: remap
    inputs: [sls_logs]
    source: |
      raw_line = .message
      ingest_ts = .timestamp

      # SLS Kafka 消费 value 结构：单字段日志为字段原值，多字段日志为 JSON
      parsed, err = parse_json(.message)
      if err == null && is_object(parsed) {
        . = merge!(., parsed)
        .message = raw_line

        # ============================================================
        # 事件时间解析
        # 优先级：① 事件自身 timestamp 字段（裸格式按北京时间解释）
        #         ② Vector 摄入时间（兜底）
        # ============================================================
        ts_raw = parsed.timestamp
        if ts_raw != null {
          ts_str = to_string!(ts_raw)
          ts_sec = to_int(ts_raw) ?? 0
          result = null
          err = null
          if ts_sec > 10000000000 {
            # 毫秒级 Unix 时间戳 → 先转秒再解析
            result, err = parse_timestamp(to_string!(to_int!(ts_sec / 1000)), format: "%s")
          } else if ts_sec > 0 && !contains(ts_str, "-") {
            # 秒级 Unix 时间戳（纯数字）
            result, err = parse_timestamp(ts_str, format: "%s")
          } else {
            # 字符串事件时间（如 2026-09-07 17:09:55,994，无时区后缀）
            # 裸格式按北京时间解释：追加 +08:00 后解析，不依赖容器时区设置
            result, err = parse_timestamp(ts_str + " +08:00", format: "%Y-%m-%d %H:%M:%S,%3f %:z")
            if err != null {
              # 点号毫秒变体：2026-09-07 17:09:55.994
              result, err = parse_timestamp(ts_str + " +08:00", format: "%Y-%m-%d %H:%M:%S.%3f %:z")
            }
            if err != null {
              # RFC3339 兼容（存量/新项目规范格式）
              result, err = parse_timestamp(ts_str, format: "%+")
            }
          }
          if err == null {
            .timestamp = result
          } else {
            .timestamp = ingest_ts
            log("SLS timestamp parse failed, using ingestion time: " + err, level: "warn")
          }
        } else {
          .timestamp = ingest_ts
        }

        # ============================================================
        # 规范化时间字段 ts (RFC3339)：下游统一消费 ts
        # ============================================================
        .ts = format_timestamp!(.timestamp, format: "%+")
      } else if err != null {
        # 单字段 content 日志的 value 为字段原值（非 JSON），保留原样
        log("SLS message is not valid JSON line: " + err, level: "warn")
      } else {
        log("SLS message is JSON but not an object", level: "warn")
      }

  partition:
    type: remap
    inputs: [parse_sls]
    source: |
      # 清理空对象/空数组字段（与生产配置一致，验证 transform 行为）
      . = filter(object(.)) -> |_key, value| {
        !(is_object(value) && length(object!(value)) == 0) && !(is_array(value) && length(array!(value)) == 0)
      }

      .partition_year  = format_timestamp!(.timestamp, format: "%Y", timezone: "Asia/Shanghai")
      .partition_month = format_timestamp!(.timestamp, format: "%m", timezone: "Asia/Shanghai")
      .partition_day   = format_timestamp!(.timestamp, format: "%d", timezone: "Asia/Shanghai")
      .partition_hour  = format_timestamp!(.timestamp, format: "%H", timezone: "Asia/Shanghai")
      .partition_minute = format_timestamp!(.timestamp, format: "%M", timezone: "Asia/Shanghai")

# ------------------------------------------------------------------
# 输出目标：console（离线验证用）
# ------------------------------------------------------------------
sinks:
  console_out:
    type: console
    inputs: [partition]
    target: stdout
    encoding:
      codec: json                    # 打印完整事件，便于核对元数据与字段