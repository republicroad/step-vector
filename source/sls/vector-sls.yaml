# ============================================================
# Vector 配置：消费阿里云 SLS (Kafka 协议) → 阿里云 OSS (JSON + Parquet 双输出)
# ============================================================
#
# 参考文档：
# - SLS Kafka 协议消费：https://www.alibabacloud.com/help/en/sls/use-the-kafka-protocol-to-upload-logs#aaccbd64bf9le
# - Vector Kafka source：https://vector.dev/docs/reference/configuration/sources/kafka/
#
# SLS Kafka 协议关键点：
# - Endpoint 格式：${region}.log.aliyuncs.com:10011 (如 cn-hangzhou.log.aliyuncs.com:10011)
# - Topic 映射：${project}_${logstore} (SLS 的 Project + Logstore 组合)
# - 认证：SASL_SSL + PLAIN 或 SCRAM-SHA-512
# - Topic 即为 SLS 的 Project_Logstore 组合
# ============================================================

data_dir: /vector-data-dir

# ------------------------------------------------------------------
# 密钥管理：从本地 JSON 文件读取，不在 YAML 中明文写入
# ------------------------------------------------------------------
secret:
  sls_credentials:
    type: file
    # 容器内路径，对应 compose/challenging 中挂载的 secrets/sls-secrets.json
    path: /etc/vector/sls-secrets.json

# ------------------------------------------------------------------
# 数据源：消费 SLS (Kafka 协议)
# ------------------------------------------------------------------
sources:
  sls_logs:
    type: kafka
    # SLS Kafka 协议 Endpoint 格式：${region}.log.aliyuncs.com:10011
    # 示例：cn-hangzhou.log.aliyuncs.com:10011
    # 请在 secrets/sls-secrets.json 中配置 endpoint，或直接写死
    bootstrap_servers: "${SLS_ENDPOINT}"
    
    # SLS Topic 映射规则：${project}_${logstore}
    # 示例：my-project_my-logstore
    # 支持正则匹配：以 ^ 开头按正则匹配（如 ^my-project_.*）
    topics:
      - "${SLS_TOPIC}"
    
    group_id: vector-sls-oss               # 消费组：位移存 broker 端 __consumer_offsets
    auto_offset_reset: earliest            # 无位移时从头消费；生产视需求改 latest
    session_timeout_ms: 30000              # 心跳超时，SLS 建议 >= 30s
    # commit_interval_ms: 5000             # 位移自动提交间隔（默认 5s）
    
    # ================================================================
    # 安全协议：SASL_SSL（SLS 强制要求）
    # 两种认证机制任选其一，取消对应注释即可
    # ================================================================
    
    # Kafka SASL 认证配置（SLS 强制要求 SASL_SSL）
    # 两种认证机制任选其一，取消对应注释即可
    
    # ----------------------------------------------------------------
    # 方式一：SASL_SSL + PLAIN（最常用，SLS 默认支持）
    # username = AccessKey ID，password = AccessKey Secret
    # ----------------------------------------------------------------
    sasl:
      enabled: true
      mechanism: PLAIN                     # 或 SCRAM-SHA-512
      username: SECRET[sls_credentials.access_key_id]
      password: SECRET[sls_credentials.access_key_secret]
    
    # ----------------------------------------------------------------
    # 方式二：SASL_SSL + SCRAM-SHA-512（更安全，需 SLS 开启 SCRAM 支持）
    # 取消下面注释并注释掉上面的 PLAIN 配置即可切换
    # ----------------------------------------------------------------
    # sasl:
    #   enabled: true
    #   mechanism: SCRAM-SHA-512
    #   username: SECRET[sls_credentials.access_key_id]
    #   password: SECRET[sls_credentials.access_key_secret]
    
    # TLS/SSL 配置（SLS 强制要求 SSL，Vector 会自动启用 TLS 当配置 sasl 时）
    # 如需自定义 CA 证书路径，取消注释：
    # tls:
    #   enabled: true
    #   ca_file: /etc/ssl/certs/ca-certificates.crt
    
    # Kafka 消费者优化参数（如需调优请参考 Vector 文档）
    # fetch_max_bytes: 10485760
    # fetch_wait_max_ms: 500

# ------------------------------------------------------------------
# 转换：解析 SLS 日志 + 生成分区字段
# ------------------------------------------------------------------
transforms:
  # 第一步：解析 SLS 日志 JSON + 提取 SLS 特有字段 + 事件时间戳
  parse_sls:
    type: remap
    inputs: [sls_logs]
    source: |
      raw_line = .message                  # 保留原始日志行
      ingest_ts = .timestamp               # Vector 摄入时间（备用）
      
      # SLS 消息体通常为 JSON，包含 SLS 保留字段
      parsed, err = parse_json(.message)
      if err == null && is_object(parsed) {
        . = merge!(., parsed)              # 将 JSON 字段提升到顶层
        
        # 保留原始消息体
        .message = raw_line
        
        # ============================================================
        # SLS 保留字段映射（SLS Kafka 协议特有字段）
        # 参考：https://www.alibabacloud.com/help/en/sls/use-the-kafka-protocol-to-upload-logs#aaccbd64bf9le
        # ============================================================
        # __topic__       ->  日志主题（用户自定义，可为空）
        # __source__      ->  日志来源（IP/主机名等）
        # __timestamp__   ->  日志时间戳（Unix 秒，SLS 写入时间）
        # __partition_time__ -> 分区时间（Unix 秒）
        # __shard__       ->  Shard ID
        # ============================================================
        
        # 提取 SLS 保留字段到结构化字段
        if exists(parsed."__topic__") {
          .sls_topic = parsed."__topic__"
        }
        if exists(parsed."__source__") {
          .sls_source = parsed."__source__"
        }
        if exists(parsed."__timestamp__") {
          .sls_timestamp = parsed."__timestamp__"
        }
        if exists(parsed."__partition_time__") {
          .sls_partition_time = parsed."__partition_time__"
        }
        if exists(parsed."__shard__") {
          .sls_shard = parsed."__shard__"
        }
        
        # 恢复原始日志行作为 message 字段
        .message = raw_line
        
        # ============================================================
        # 事件时间戳解析（优先使用 SLS 写入时间 __timestamp__）
        # ============================================================
        ts_raw = parsed."__timestamp__"
        if ts_raw == null {
          ts_raw = parsed.timestamp
        }
        if ts_raw == null {
          ts_raw = ""
        }
        if ts_raw != "" {
          # __timestamp__ 通常为 Unix 秒（整数）或 RFC3339 字符串
          ts_sec = to_int(ts_raw) ?? 0
          # 确保 ts_raw 是字符串类型（使用 ! 使其 infallible）
          ts_str = to_string!(ts_raw)
          result = null
          if ts_sec > 10000000000 {  # 判断是否为毫秒级（> 2001年）
            result, err = parse_timestamp(ts_str, format: "%s")
          } else {
            result, err = parse_timestamp(ts_str, format: "%+")
          }
          # result 为 null 表示解析失败
          if err == null {
            .timestamp = result
          } else {
            .timestamp = ingest_ts
            log("SLS timestamp parse failed, using ingestion time: " + err, level: "warn")
          }
        } else {
          .timestamp = ingest_ts
        }
        
        # kafka source 自动附加的元数据字段（保留用于排查）
        # .topic / .partition / .offset / .message_key / .source_type
      } else if err != null {
        log("SLS message is not valid JSON line: " + err, level: "warn")
      } else {
        log("SLS message is JSON but not an object", level: "warn")
      }

  # 第二步：从事件时间戳生成 Hive 风格分区字段 (北京时间)
  partition:
    type: remap
    inputs: [parse_sls]
    source: |
      # 按北京时间格式化分区字段，用于 key_prefix 模板
      .partition_year  = format_timestamp!(.timestamp, format: "%Y", timezone: "Asia/Shanghai")
      .partition_month = format_timestamp!(.timestamp, format: "%m", timezone: "Asia/Shanghai")
      .partition_day   = format_timestamp!(.timestamp, format: "%d", timezone: "Asia/Shanghai")
      .partition_hour  = format_timestamp!(.timestamp, format: "%H", timezone: "Asia/Shanghai")
      .partition_minute = format_timestamp!(.timestamp, format: "%M", timezone: "Asia/Shanghai")

# ------------------------------------------------------------------
# 输出目标：JSON 格式写入 OSS
# ------------------------------------------------------------------
sinks:
  aliyun_oss:
    type: aws_s3                 # OSS 兼容 S3 API，用 aws_s3 sink
    inputs: [partition]

    # OSS 连接配置（从 secret 读取或直接写死）
    bucket: "${OSS_BUCKET}"
    region: "${OSS_REGION}"
    endpoint: "https://${OSS_ENDPOINT}"
    force_path_style: false      # OSS 仅支持虚拟托管寻址 (<bucket>.oss-<region>.aliyuncs.com)

    # 对象路径：Hive 分区格式 (year/month/day/hour/minute)
    key_prefix: "sls/log_json/year={{ partition_year }}/month={{ partition_month }}/day={{ partition_day }}/hour={{ partition_hour }}/minute={{ partition_minute }}/"
    timezone: Asia/Shanghai
    filename_time_format: "%s"   # Unix 时间戳作为文件名前缀
    filename_append_uuid: true   # 追加 UUID 防覆盖

    # 写入格式：原始日志行 (换行分隔)，下游直接消费无需剥 Vector 包裹层
    compression: gzip
    encoding:
      codec: raw_message         # 对象内容 = 原始日志行
    framing:
      method: newline_delimited

    # 批次控制：攒够或超时后 flush
    batch:
      timeout_secs: 15
      max_bytes: 10485760        # 10 MB
      max_events: 100000

    # 认证：从 secret 文件引用
    auth:
      access_key_id: SECRET[oss_credentials.access_key_id]
      secret_access_key: SECRET[oss_credentials.secret_access_key]

  # ------------------------------------------------------------------
  # 输出目标：Parquet 列式格式写入 OSS
  # ------------------------------------------------------------------
  aliyun_oss_parquet:
    type: aws_s3
    inputs: [partition]

    bucket: "${OSS_BUCKET}"
    region: "${OSS_REGION}"
    endpoint: "https://${OSS_ENDPOINT}"
    force_path_style: false

    # 对象路径：Hive 分区格式 (无 minute，Parquet 按小时聚合)
    key_prefix: "sls/log_parquet/year={{ partition_year }}/month={{ partition_month }}/day={{ partition_day }}/hour={{ partition_hour }}/"
    timezone: Asia/Shanghai
    filename_time_format: "%s"
    filename_append_uuid: true

    # 写入格式：Parquet 列式 (下游 Athena/EMR 分析更友好)
    encoding:
      codec: json                # 占位，batch_encoding 会接管
    batch_encoding:
      codec: parquet
      schema_mode: auto_infer    # 自动推断 schema，无需预定义
      compression:
        algorithm: snappy        # 列页内压缩：snappy (快) | zstd (高压缩比) | gzip | lz4 | none

    batch:
      timeout_secs: 15
      max_bytes: 10485760        # 10 MB
      max_events: 100000

    auth:
      access_key_id: SECRET[oss_credentials.access_key_id]
      secret_access_key: SECRET[oss_credentials.secret_access_key]