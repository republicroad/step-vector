# ============================================================
# 离线端到端验证：Kafka + producer + Vector(console sink)
# 与 compose.yaml 的区别：vector 换用 vector-test.yaml，打印到 stdout，不接 OSS
# ============================================================
#
# 用法：
#   podman compose -f compose-test.yaml up -d
#   podman compose -f compose-test.yaml logs -f vector
#   # 每条事件应带 .topic/.partition/.offset/.message_key 及 partition_* 分区字段
#
#   podman compose -f compose-test.yaml down -v

name: vector-kafka-to-console

services:
  kafka:
    image: apache/kafka:4.0.0
    restart: unless-stopped
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      TZ: Asia/Shanghai
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  kafka-init:
    image: apache/kafka:4.0.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic app-logs \
          --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list

  producer:
    image: python:3.12-alpine
    restart: unless-stopped
    depends_on: [kafka-init]
    volumes:
      - ./gen-log.py:/app/gen-log.py:ro
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: app-logs
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
    command: sh -c "pip install --no-cache-dir 'kafka-python-ng==2.2.3' && python /app/gen-log.py"

  vector:
    image: timberio/vector:latest-alpine
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      # 测试配置挂载为默认配置路径，免改启动命令
      - ./vector-test.yaml:/etc/vector/vector.yaml:ro
      - vector-data:/vector-data-dir
    environment:
      TZ: Asia/Shanghai
      VECTOR_LOG: info

volumes:
  kafka-data:
  vector-data:
