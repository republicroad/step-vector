# Vector DaemonSet：在真实 Kubernetes 集群采集全部 Pod 日志
# kubectl apply -f k8s/daemonset.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: vector
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector
  namespace: vector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vector
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vector
subjects:
  - kind: ServiceAccount
    name: vector
    namespace: vector
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
  namespace: vector
data:
  vector.yaml: |
    data_dir: /vector-data-dir
    sources:
      k8s_logs:
        type: kubernetes_logs
        auto_partial_merge: true
    transforms:
      normalize:
        type: remap
        inputs: [k8s_logs]
        source: |
          .pod = .kubernetes.pod_name
          .namespace = .kubernetes.pod_namespace
          .container = .kubernetes.container_name
    sinks:
      console:
        type: console
        inputs: [normalize]
        encoding:
          codec: json
      # better_stack:
      #   type: http
      #   method: post
      #   inputs: [normalize]
      #   uri: "https://$INGESTING_HOST/"
      #   encoding:
      #     codec: json
      #   compression: gzip
      #   auth:
      #     strategy: bearer
      #     token: "$SOURCE_TOKEN"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
  namespace: vector
spec:
  selector:
    matchLabels:
      app: vector
  template:
    metadata:
      labels:
        app: vector
    spec:
      serviceAccountName: vector
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vector
          image: timberio/vector:latest-alpine
          args: ["--config", "/etc/vector/vector.yaml"]
          env:
            - name: VECTOR_LOG
              value: "info"
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: config
              mountPath: /etc/vector
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: data
              mountPath: /vector-data-dir
      volumes:
        - name: config
          configMap:
            name: vector-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: data
          hostPath:
            path: /var/lib/vector
            type: DirectoryOrCreate
