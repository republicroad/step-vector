name: vector-collect-docker

services:
  # 两个应用容器持续输出日志（docker_logs source 采集的对象）
  # 注意：command 里不要用内嵌转义引号（podman-compose 的 shlex 解析会崩），复杂输出用脚本文件
  app1:
    image: busybox:latest
    restart: unless-stopped
    volumes:
      - ./app1.sh:/app/app1.sh:ro
    command: sh /app/app1.sh
    # podman 默认 log driver 为 journald，其 Docker 兼容日志 API 读不到内容；
    # 显式 json-file（Docker 默认，podman 映射为 k8s-file）保证 docker_logs source 可读
    logging:
      driver: json-file

  app2:
    image: busybox:latest
    restart: unless-stopped
    command: sh -c 'while true; do echo app2-plain-text-log-line; sleep 4; done'
    logging:
      driver: json-file

  vector:
    image: timberio/vector:latest-alpine
    restart: unless-stopped
    # docker.sock 属主通常为 root，vector 镜像默认 uid 1000 无连接权限，需以 root 运行
    user: "0"
    depends_on:
      - app1
      - app2
    volumes:
      - ./vector.yaml:/etc/vector/vector.yaml:ro
      - ./output:/var/lib/vector/output
      - vector-data:/vector-data-dir
      # Docker/Podman 兼容 socket；Podman 机器内通常有 /var/run/docker.sock 软链
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
    environment:
      TZ: Asia/Shanghai
      # podman 注入的代理变量会劫持 docker socket 的 UDS 请求（Connection refused），必须清空
      HTTP_PROXY: ""
      http_proxy: ""
      HTTPS_PROXY: ""
      https_proxy: ""

volumes:
  vector-data:
