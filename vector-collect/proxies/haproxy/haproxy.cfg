# haproxy 配置：请求日志以 syslog (UDP) 发给 compose 网络内的 vector
global
    log vector:1514 local0

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend fe
    # 非特权端口（haproxy 官方镜像以 haproxy 用户运行，绑定 80 会 Permission denied）
    bind :8080
    # 无需后端：haproxy 直接返回响应，同时产生 HTTP 请求日志
    http-request return status 200 content-type "text/plain" string "hello from haproxy\n"
