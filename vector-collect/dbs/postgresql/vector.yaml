# ============================================================
# Vector 采集演示：PostgreSQL 日志 → 解析 → 本地文件
# 对应 Better Stack config: https://telemetry.betterstack.com/vector-yaml/postgresql/$SOURCE_TOKEN
# 演示要点：file source + postgres 标准日志格式正则解析
# ============================================================

data_dir: /vector-data-dir

sources:
  postgres_log:
    type: file
    include:
      - /var/log/postgresql/postgresql.log
    read_from: beginning
    fingerprint:
      strategy: checksum
    multiline:
      start_pattern: '^\d{4}-\d{2}-\d{2} '
      condition_pattern: '^\d{4}-\d{2}-\d{2} '
      mode: halt_before
      timeout_ms: 1000

transforms:
  parse_postgres:
    type: remap
    inputs: [postgres_log]
    source: |
      # 行示例: 2026-09-03 10:00:00.123 UTC [75] LOG:  duration: 1.234 ms  statement: SELECT 1;
      # 有会话信息时: 2026-09-03 10:00:00.123 UTC [75] demo@demo LOG:  statement: SELECT 1;
      parsed, err = parse_regex(.message, r'^(?P<ts>\d{4}-\d{2}-\d{2} [\d:.]+ \w+) \[(?P<pid>\d+)\] (?:(?P<user>\S+)@(?P<database>\S+) )?(?P<level>[A-Z]+):\s*(?P<msg>.*)$')
      if err == null {
        .pid = parsed.pid
        .level = parsed.level
        if parsed.user != "" {
          .user = parsed.user
          .database = parsed.database
        }
        .message = parsed.msg
        ts, ts_err = parse_timestamp(parsed.ts, format: "%Y-%m-%d %H:%M:%S%.f %Z")
        if ts_err == null {
          .timestamp = ts
        }
      } else {
        log("postgres parse failed: " + err, level: "warn")
      }

sinks:
  local_file:
    type: file
    inputs: [parse_postgres]
    path: /var/lib/vector/output/postgresql-%Y%m%d.ndjson
    encoding:
      codec: json

  console:
    type: console
    inputs: [parse_postgres]
    encoding:
      codec: json

  # ---------------- Better Stack 官方 sink（可选） ----------------
  # better_stack:
  #   type: http
